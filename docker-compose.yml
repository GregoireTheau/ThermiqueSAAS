services:
  thermal-saas:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - thermal_saas_data:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  thermal_saas_data:
